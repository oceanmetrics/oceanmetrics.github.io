# What Ocean Metrics is working on right now. Read by /now/, the "Latest" block on each project page
# and nothing else. Refreshed about monthly from the project logs; `updated` is the date of the last refresh.
updated: 2026-11-06
now: Shipping monthly releases of the CalCOFI database, a review build of the Marine Sensitivity Toolkit, and the Ocean Metrics atlas on its new storage.
projects:
