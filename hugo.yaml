baseURL: https://oceanmetrics.io/
locale: en-us
title: Ocean Metrics
enableEmoji: false
summaryLength: 30

params:
  tagline: Ocean data science studio
  description: Ocean Metrics is the practice of Ben Best, PhD — building the analyses, maps, and open-data platforms behind federal and research ocean programs. Formerly EcoQuants.
  # the front page leads with the platform (decision D4): its one line, the search's examples
  platformEyebrow: Places · Indicators · Atlas
  platformHeadline: Ocean indicators for any place, from open data
  platformTry: [Channel Islands, Gulf of Maine, Monterey Bay]
  # the studio's intro, below the platform on the front page
  heroHeadline: Measuring the ocean, from raw observations to decisions
  heroLead: I build the species models, interactive maps, and open-data platforms that ocean science relies on — rigorous, reproducible work for agencies and research programs.
  # a generated illustration can be dropped in here later (see PLAN.md §8); until then the hero uses a gradient
  heroImage: ""
  # contact / identity
  email: ben@oceanmetrics.io
  github: https://github.com/oceanmetrics
  cv: https://bbest.github.io/cv/
  orcid: https://orcid.org/0000-0002-2686-0784
  # email alerts (/alerts/): the om-alerts Worker. workers.dev until the zone is active, then https://alerts.oceanmetrics.io
  alerts_api: https://om-alerts.ben-f07.workers.dev
  # the public Turnstile site key for the subscribe form; empty = no widget is rendered (the Worker skips the check
  # until its TURNSTILE_SECRET is set)
  turnstile_site_key: ""
  # the GA4 measurement id: empty here, always. deploy.yml sets HUGOxPARAMSxGA_ID (Hugo's x-delimited
  # form, since the key has an underscore) from the repository variable GA_ID;
  # empty or malformed = no analytics (layouts/partials/header.html, the bar's data-ga)
  ga_id: ""

menu:
  main:
    - name: Projects
      pageRef: /projects
      weight: 1
    - name: Tools
      pageRef: /tools
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Contact
      pageRef: /contact
      weight: 4

# no tags/categories on this brochure site
disableKinds:
  - taxonomy
  - term

markup:
  goldmark:
    renderer:
      unsafe: true

build:
  writeStats: false

# the shared nav bar (@oceanmetrics/nav, pinned in package.json) is mounted as assets/om-nav so
# header.html can bundle it with js.Build. Declaring a mount replaces the default for its component.
module:
  mounts:
    - source: assets
      target: assets
    - source: node_modules/@oceanmetrics/nav/dist
      target: assets/om-nav
