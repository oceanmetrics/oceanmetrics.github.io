name: Refresh tools gallery

# Weekly: re-read each tool's last commit, version and live HTTP status, retake light and
# dark screenshots, commit whatever changed, then trigger the site deploy. Pushes made with
# GITHUB_TOKEN do not fire push-triggered workflows, hence the explicit dispatch.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only these tool slugs (comma-separated); blank = all"
        required: false
        default: ""
      screenshots:
        description: "Retake screenshots"
        type: boolean
        default: true
      force:
        description: "Replace screenshots even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-tools
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-tools.txt
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-tools.txt
          python -m playwright install --with-deps chromium
      - name: Refresh status (last commit, version, HTTP)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/tools_refresh.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Retake screenshots
        if: ${{ github.event_name == 'schedule' || inputs.screenshots }}
        run: python scripts/tools_shots.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tools_status.json data/tools_shots.json assets/img/tools
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "tools: refresh status and screenshots ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
