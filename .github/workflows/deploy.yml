name: Deploy Ocean Metrics site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Fetch the schemas of the pinned @oceanmetrics/catalog (package.json)
        # copies node_modules/@oceanmetrics/catalog/schemas/*.schema.json to static/schemas/<name>/v<version>/schema.json
        # (path read from each $id) plus schemas/index.json and data/schemas.json for the /schemas/ page
        run: |
          npm ci --ignore-scripts
          node scripts/sync-schemas.mjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # a custom domain (CNAME) serves at the root, so keep the site's own baseURL
        run: hugo --gc --minify
      - name: Check internal links
        # fails the deploy if any internal link 404s. allow known issues in scripts/linkcheck_allow.txt
        run: python3 scripts/check_links.py public
      - name: Check every schema is served at its $id
        run: node scripts/check-schemas.mjs public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    # the live check: every $id answers 200 from oceanmetrics.io (Pages needs a moment to publish)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned catalog
        run: npm ci --ignore-scripts
      - name: Live $id check
        run: node scripts/check-schemas.mjs --live https://oceanmetrics.io --retries 12
