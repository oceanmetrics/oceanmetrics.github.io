name: Deploy Ocean Metrics site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # daily, after the indicators' daily check (about 13:20 UTC): the front page's baked counts and "What changed"
    # are a day old at most
    - cron: "17 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Fetch the schemas of the pinned @oceanmetrics/catalog (package.json)
        # copies node_modules/@oceanmetrics/catalog/schemas/*.schema.json to static/schemas/<name>/v<version>/schema.json
        # (path read from each $id) plus schemas/index.json and data/schemas.json for the /schemas/ page
        run: |
          npm ci --ignore-scripts
          node scripts/sync-schemas.mjs
      - name: Front page counts and "What changed" from the bucket
        # scripts/counts.mjs -> data/counts.json (layers.json, indicators.json, coverage.parquet, atlas/catalog.json,
        # changes/latest.json, feeds/all.xml) through @oceanmetrics/catalog/storage's host rule (OM_STORAGE, else the
        # default). If the bucket does not answer, the committed file (the last good numbers) stays, with a warning.
        run: node scripts/counts.mjs
      - name: Unit tests and the no-addresses check
        # the pure functions of static/js/alerts.js (request bodies, hash parsing) and: no email address in the repo
        run: |
          npm test
          node scripts/check-no-addresses.mjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          # analytics only when the repository variable GA_ID is set (a GA4 id; the bar's data-ga, README "Analytics").
          # the x delimiter is Hugo's own form for a key with an underscore: HUGO_PARAMS_GA_ID would set params.ga.id
          HUGOxPARAMSxGA_ID: ${{ vars.GA_ID }}
        # a custom domain (CNAME) serves at the root, so keep the site's own baseURL
        run: hugo --gc --minify
      - name: Check analytics
        # no gtag.js script tag in any page, and the id in the build exactly when the variable is set
        env:
          GA_ID: ${{ vars.GA_ID }}
        run: node scripts/check-ga.mjs public --id "$GA_ID"
      - name: Check internal links
        # fails the deploy if any internal link 404s. allow known issues in scripts/linkcheck_allow.txt
        run: python3 scripts/check_links.py public
      - name: Check every schema is served at its $id
        run: node scripts/check-schemas.mjs public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    # the live check: every $id answers 200 from oceanmetrics.io (Pages needs a moment to publish)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned catalog
        run: npm ci --ignore-scripts
      - name: Live $id check
        run: node scripts/check-schemas.mjs --live https://oceanmetrics.io --retries 12
      - name: Live front page
        # the doors and "What changed" are on oceanmetrics.io/ (Pages needs a moment to publish)
        run: |
          for i in $(seq 1 12); do
            html=$(curl -s https://oceanmetrics.io/)
            if echo "$html" | grep -Eq 'class="?door[" ]' && echo "$html" | grep -Eq 'id="?what-changed'; then echo "front page: doors and What changed live"; exit 0; fi
            sleep 10
          done
          echo "front page: doors or What changed missing"; exit 1
      - name: Live alerts pages
        # the four reader pages and the script answer 200 from oceanmetrics.io (Pages needs a moment to publish)
        run: |
          for p in alerts/ alerts/confirm/ alerts/manage/ alerts/privacy/ js/alerts.js; do
            ok=0
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://oceanmetrics.io/$p")
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 10
            done
            echo "$code  https://oceanmetrics.io/$p"
            [ "$ok" = 1 ] || exit 1
          done
